<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"
     aria-label="Timeline from February to September 2026 showing two Copilot surfaces on separate lanes.
     The VS Code extension gained tool search in February, cache_control breakpoints in April, and
     OpenTelemetry in May. The Copilot CLI gained cache-write display in June, corrected telemetry
     attribute names in June, and cache_control breakpoints only in August — about three months after
     the extension.">
  <title>Copilot's surfaces gained caching months apart</title>
  <rect width="760" height="320" fill="#0d1117"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#e6edf3">"Copilot" gained caching on two different dates</text>
  <text x="24" y="50" font-size="12" fill="#9198a1">Same product name, separate repositories, separate release trains. 2026.</text>

  <!-- time axis : Feb=110 .. Sep=712, ~86px per month -->
  <line x1="110" y1="272" x2="712" y2="272" stroke="#6b7280"/>
  <text x="110" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">Feb</text>
  <text x="196" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">Mar</text>
  <text x="282" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">Apr</text>
  <text x="368" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">May</text>
  <text x="454" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">Jun</text>
  <text x="540" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">Jul</text>
  <text x="626" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">Aug</text>
  <text x="712" y="290" font-size="10.5" text-anchor="middle" fill="#7d8590">Sep</text>

  <!-- lane : VS Code extension -->
  <text x="24" y="106" font-size="12" font-weight="700" fill="#e6edf3">VS Code</text>
  <text x="24" y="121" font-size="10.5" fill="#7d8590">extension</text>
  <line x1="110" y1="112" x2="712" y2="112" stroke="#30363d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="121" cy="112" r="6" fill="#14351f" stroke="#3fb950" stroke-width="2"/>
  <text x="121" y="94" font-size="10" text-anchor="middle" fill="#9198a1">tool search</text>
  <circle cx="292" cy="112" r="7" fill="#3a2410" stroke="#d29922" stroke-width="2.5"/>
  <text x="292" y="88" font-size="11" text-anchor="middle" font-weight="700" fill="#ffa657">cache_control</text>
  <text x="292" y="76" font-size="10" text-anchor="middle" fill="#7d8590">1.118 · Apr 29</text>
  <circle cx="374" cy="112" r="6" fill="#14351f" stroke="#3fb950" stroke-width="2"/>
  <text x="380" y="94" font-size="10" text-anchor="middle" fill="#9198a1">OTel · 1.119</text>
  <circle cx="626" cy="112" r="6" fill="#14351f" stroke="#3fb950" stroke-width="2"/>
  <text x="640" y="94" font-size="10" text-anchor="middle" fill="#9198a1">per-model tokens</text>

  <!-- lane : CLI -->
  <text x="24" y="216" font-size="12" font-weight="700" fill="#e6edf3">Copilot CLI</text>
  <text x="24" y="231" font-size="10.5" fill="#7d8590">separate repo</text>
  <line x1="110" y1="222" x2="712" y2="222" stroke="#30363d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="459" cy="222" r="6" fill="#14351f" stroke="#3fb950" stroke-width="2"/>
  <text x="459" y="248" font-size="10" text-anchor="middle" fill="#9198a1">cache-write shown</text>
  <text x="459" y="260" font-size="10" text-anchor="middle" fill="#7d8590">v1.0.60 · Jun 5</text>
  <circle cx="510" cy="222" r="6" fill="#14351f" stroke="#3fb950" stroke-width="2"/>
  <text x="540" y="212" font-size="10" text-anchor="middle" fill="#9198a1">OTel names fixed · v1.0.64</text>
  <circle cx="637" cy="222" r="7" fill="#3a2410" stroke="#d29922" stroke-width="2.5"/>
  <text x="637" y="248" font-size="11" text-anchor="middle" font-weight="700" fill="#ffa657">cache_control</text>
  <text x="637" y="260" font-size="10" text-anchor="middle" fill="#7d8590">v1.0.78 · Aug 3</text>

  <!-- the gap -->
  <line x1="292" y1="126" x2="292" y2="208" stroke="#f85149" stroke-dasharray="4 3"/>
  <line x1="637" y1="126" x2="637" y2="208" stroke="#f85149" stroke-dasharray="4 3"/>
  <line x1="292" y1="167" x2="637" y2="167" stroke="#f85149" stroke-width="1.5"/>
  <rect x="382" y="155" width="166" height="24" rx="4" fill="#3d1518" stroke="#f85149"/>
  <text x="465" y="171" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ff7b72">~3 months apart</text>

  <text x="24" y="312" font-size="11.5" fill="#9198a1">Telemetry ran the other way: the CLI showed cache-write tokens <tspan font-weight="600" fill="#e6edf3">twelve weeks before</tspan> the extension. Neither surface is uniformly ahead.</text>
</svg>
