<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"
     aria-label="Four agent turns shown as horizontal bars. Turns 1 to 3 grow by appending, with the
     unchanged prefix served from cache at one tenth the input rate. On turn 4 the model is switched,
     so the entire request is reprocessed as uncached input at full price.">

  <title>What one turn actually costs</title>

  <rect width="760" height="400" fill="#0d1117"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#e6edf3">What one turn actually costs</text>
  <text x="24" y="50" font-size="12" fill="#9198a1">Each request re-sends the whole conversation. Only the striped part is billed at full rate.</text>

  <!-- legend -->
  <rect x="24" y="66" width="12" height="12" rx="2" fill="#14351f" stroke="#3fb950"/>
  <text x="42" y="76" font-size="11.5" fill="#9198a1">cache read — ~0.1× input</text>
  <rect x="218" y="66" width="12" height="12" rx="2" fill="#3a2410" stroke="#d29922"/>
  <text x="236" y="76" font-size="11.5" fill="#9198a1">cache write — 1.25× (5m) / 2.0× (1h)</text>
  <rect x="478" y="66" width="12" height="12" rx="2" fill="#3d1518" stroke="#f85149"/>
  <text x="496" y="76" font-size="11.5" fill="#9198a1">uncached input — 1.0× full price</text>

  <!-- turn 1 : cold start, everything is a cache write -->
  <text x="24" y="118" font-size="12" font-weight="600" fill="#e6edf3">Turn 1</text>
  <text x="24" y="134" font-size="10.5" fill="#7d8590">cold start</text>
  <rect x="96" y="104" width="150" height="30" rx="3" fill="#3a2410" stroke="#d29922"/>
  <text x="171" y="123" font-size="11" text-anchor="middle" fill="#ffa657">system + tools + context</text>
  <rect x="246" y="104" width="46" height="30" rx="3" fill="#3d1518" stroke="#f85149"/>
  <text x="269" y="123" font-size="10.5" text-anchor="middle" fill="#ff7b72">msg</text>
  <text x="712" y="123" font-size="11" text-anchor="end" fill="#7d8590">most expensive turn</text>

  <!-- turn 2 -->
  <text x="24" y="176" font-size="12" font-weight="600" fill="#e6edf3">Turn 2</text>
  <text x="24" y="192" font-size="10.5" fill="#7d8590">warm</text>
  <rect x="96" y="162" width="196" height="30" rx="3" fill="#14351f" stroke="#3fb950"/>
  <text x="194" y="181" font-size="11" text-anchor="middle" fill="#7ee787">everything above, read from cache</text>
  <rect x="292" y="162" width="52" height="30" rx="3" fill="#3d1518" stroke="#f85149"/>
  <text x="318" y="181" font-size="10.5" text-anchor="middle" fill="#ff7b72">new</text>
  <text x="712" y="181" font-size="11" text-anchor="end" fill="#7d8590">~21% of uncached cost</text>

  <!-- turn 3 -->
  <text x="24" y="234" font-size="12" font-weight="600" fill="#e6edf3">Turn 3</text>
  <text x="24" y="250" font-size="10.5" fill="#7d8590">warm</text>
  <rect x="96" y="220" width="248" height="30" rx="3" fill="#14351f" stroke="#3fb950"/>
  <text x="220" y="239" font-size="11" text-anchor="middle" fill="#7ee787">cached prefix keeps growing</text>
  <rect x="344" y="220" width="52" height="30" rx="3" fill="#3d1518" stroke="#f85149"/>
  <text x="370" y="239" font-size="10.5" text-anchor="middle" fill="#ff7b72">new</text>
  <text x="712" y="239" font-size="11" text-anchor="end" fill="#7d8590">the cheap case</text>

  <!-- divider -->
  <line x1="24" y1="272" x2="736" y2="272" stroke="#30363d" stroke-dasharray="3 3"/>
  <text x="96" y="290" font-size="11" font-weight="600" fill="#ff7b72">↓ you switch model, change effort, or a tool definition moves</text>

  <!-- turn 4 : full invalidation -->
  <text x="24" y="326" font-size="12" font-weight="600" fill="#e6edf3">Turn 4</text>
  <text x="24" y="342" font-size="10.5" fill="#7d8590">invalidated</text>
  <rect x="96" y="312" width="300" height="30" rx="3" fill="#3d1518" stroke="#f85149"/>
  <text x="246" y="331" font-size="11" text-anchor="middle" fill="#ff7b72">the entire conversation, reprocessed at full price</text>
  <rect x="396" y="312" width="52" height="30" rx="3" fill="#3d1518" stroke="#f85149"/>
  <text x="422" y="331" font-size="10.5" text-anchor="middle" fill="#ff7b72">new</text>
  <text x="712" y="331" font-size="11" text-anchor="end" font-weight="600" fill="#ff7b72">cost scales with session length</text>

  <text x="24" y="378" font-size="11.5" fill="#9198a1">The turn that triggers a miss is not the expensive one — <tspan font-weight="600" fill="#e6edf3">every turn after it pays to rebuild the prefix.</tspan></text>
</svg>
