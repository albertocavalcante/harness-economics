<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"
     aria-label="Four agent turns shown as horizontal bars. Turns 1 to 3 grow by appending, with the
     unchanged prefix served from cache at one tenth the input rate. On turn 4 the model is switched,
     so the entire request is reprocessed as uncached input at full price.">

  <title>What one turn actually costs</title>

  <rect width="760" height="400" fill="#ffffff"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#111827">What one turn actually costs</text>
  <text x="24" y="50" font-size="12" fill="#4b5563">Each request re-sends the whole conversation. Only the striped part is billed at full rate.</text>

  <!-- legend -->
  <rect x="24" y="66" width="12" height="12" rx="2" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="42" y="76" font-size="11.5" fill="#374151">cache read — ~0.1× input</text>
  <rect x="218" y="66" width="12" height="12" rx="2" fill="#fed7aa" stroke="#ea580c"/>
  <text x="236" y="76" font-size="11.5" fill="#374151">cache write — 1.25× (5m) / 2.0× (1h)</text>
  <rect x="478" y="66" width="12" height="12" rx="2" fill="#fecaca" stroke="#dc2626"/>
  <text x="496" y="76" font-size="11.5" fill="#374151">uncached input — 1.0× full price</text>

  <!-- turn 1 : cold start, everything is a cache write -->
  <text x="24" y="118" font-size="12" font-weight="600" fill="#111827">Turn 1</text>
  <text x="24" y="134" font-size="10.5" fill="#6b7280">cold start</text>
  <rect x="96" y="104" width="150" height="30" rx="3" fill="#fed7aa" stroke="#ea580c"/>
  <text x="171" y="123" font-size="11" text-anchor="middle" fill="#7c2d12">system + tools + context</text>
  <rect x="246" y="104" width="46" height="30" rx="3" fill="#fecaca" stroke="#dc2626"/>
  <text x="269" y="123" font-size="10.5" text-anchor="middle" fill="#7f1d1d">msg</text>
  <text x="712" y="123" font-size="11" text-anchor="end" fill="#6b7280">most expensive turn</text>

  <!-- turn 2 -->
  <text x="24" y="176" font-size="12" font-weight="600" fill="#111827">Turn 2</text>
  <text x="24" y="192" font-size="10.5" fill="#6b7280">warm</text>
  <rect x="96" y="162" width="196" height="30" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="194" y="181" font-size="11" text-anchor="middle" fill="#14532d">everything above, read from cache</text>
  <rect x="292" y="162" width="52" height="30" rx="3" fill="#fecaca" stroke="#dc2626"/>
  <text x="318" y="181" font-size="10.5" text-anchor="middle" fill="#7f1d1d">new</text>
  <text x="712" y="181" font-size="11" text-anchor="end" fill="#6b7280">~21% of uncached cost</text>

  <!-- turn 3 -->
  <text x="24" y="234" font-size="12" font-weight="600" fill="#111827">Turn 3</text>
  <text x="24" y="250" font-size="10.5" fill="#6b7280">warm</text>
  <rect x="96" y="220" width="248" height="30" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="220" y="239" font-size="11" text-anchor="middle" fill="#14532d">cached prefix keeps growing</text>
  <rect x="344" y="220" width="52" height="30" rx="3" fill="#fecaca" stroke="#dc2626"/>
  <text x="370" y="239" font-size="10.5" text-anchor="middle" fill="#7f1d1d">new</text>
  <text x="712" y="239" font-size="11" text-anchor="end" fill="#6b7280">the cheap case</text>

  <!-- divider -->
  <line x1="24" y1="272" x2="736" y2="272" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <text x="96" y="290" font-size="11" font-weight="600" fill="#b91c1c">↓ you switch model, change effort, or a tool definition moves</text>

  <!-- turn 4 : full invalidation -->
  <text x="24" y="326" font-size="12" font-weight="600" fill="#111827">Turn 4</text>
  <text x="24" y="342" font-size="10.5" fill="#6b7280">invalidated</text>
  <rect x="96" y="312" width="300" height="30" rx="3" fill="#fecaca" stroke="#dc2626"/>
  <text x="246" y="331" font-size="11" text-anchor="middle" fill="#7f1d1d">the entire conversation, reprocessed at full price</text>
  <rect x="396" y="312" width="52" height="30" rx="3" fill="#fecaca" stroke="#dc2626"/>
  <text x="422" y="331" font-size="10.5" text-anchor="middle" fill="#7f1d1d">new</text>
  <text x="712" y="331" font-size="11" text-anchor="end" font-weight="600" fill="#b91c1c">cost scales with session length</text>

  <text x="24" y="378" font-size="11.5" fill="#4b5563">The turn that triggers a miss is not the expensive one — <tspan font-weight="600" fill="#111827">every turn after it pays to rebuild the prefix.</tspan></text>
</svg>
