<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"
     aria-label="Comparison of three prompt-caching designs. Anthropic uses caller-placed breakpoints,
     a four-write budget, five-minute or one-hour TTL, and prices writes and reads. OpenAI since GPT-5.6
     also uses caller-placed breakpoints with the same four-write budget and the same 1.25 times write
     and 0.1 times read pricing, with a fixed thirty-minute TTL. Google Gemini instead creates a cached
     content resource with full lifecycle operations, an unbounded user-set TTL defaulting to one hour,
     and prices a third axis: storage per million tokens per hour.">
  <title>Three caching paradigms</title>
  <rect width="760" height="400" fill="#0d1117"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#e6edf3">Three designs — and two of them converged</text>
  <text x="24" y="50" font-size="12" fill="#9198a1">Anthropic and OpenAI now share a shape. Google prices a third axis nobody else charges for.</text>

  <!-- column headers -->
  <rect x="24" y="68" width="228" height="30" rx="4" fill="#14351f" stroke="#3fb950"/>
  <text x="138" y="88" font-size="12.5" text-anchor="middle" font-weight="700" fill="#7ee787">Anthropic</text>
  <rect x="266" y="68" width="228" height="30" rx="4" fill="#14351f" stroke="#3fb950"/>
  <text x="380" y="88" font-size="12.5" text-anchor="middle" font-weight="700" fill="#7ee787">OpenAI — GPT-5.6+</text>
  <rect x="508" y="68" width="228" height="30" rx="4" fill="#3a2410" stroke="#d29922"/>
  <text x="622" y="88" font-size="12.5" text-anchor="middle" font-weight="700" fill="#ffa657">Google Gemini</text>

  <!-- row labels -->
  <text x="24" y="128" font-size="11" font-weight="600" fill="#7d8590">WHO MARKS THE BOUNDARY</text>
  <text x="24" y="196" font-size="11" font-weight="600" fill="#7d8590">WHAT THE CACHE IS</text>
  <text x="24" y="264" font-size="11" font-weight="600" fill="#7d8590">TTL</text>
  <text x="24" y="332" font-size="11" font-weight="600" fill="#7d8590">PRICED ON</text>

  <!-- row 1 -->
  <text x="138" y="150" font-size="11.5" text-anchor="middle" fill="#9198a1">caller, in-request</text>
  <text x="138" y="166" font-size="11" text-anchor="middle" fill="#7d8590">max 4 breakpoints</text>
  <text x="380" y="150" font-size="11.5" text-anchor="middle" fill="#9198a1">caller, in-request</text>
  <text x="380" y="166" font-size="11" text-anchor="middle" fill="#7d8590">max 4 — identical budget</text>
  <text x="622" y="150" font-size="11.5" text-anchor="middle" font-weight="600" fill="#ffa657">a separate resource</text>
  <text x="622" y="166" font-size="11" text-anchor="middle" fill="#7d8590">POST it, get a handle</text>

  <!-- row 2 -->
  <text x="138" y="218" font-size="11.5" text-anchor="middle" fill="#9198a1">an annotation</text>
  <text x="380" y="218" font-size="11.5" text-anchor="middle" fill="#9198a1">an annotation</text>
  <text x="622" y="218" font-size="11.5" text-anchor="middle" font-weight="600" fill="#ffa657">an object with CRUD</text>
  <text x="622" y="234" font-size="11" text-anchor="middle" fill="#7d8590">only expiry is mutable</text>

  <!-- row 3 -->
  <text x="138" y="286" font-size="11.5" text-anchor="middle" fill="#9198a1">5m or 1h</text>
  <text x="380" y="286" font-size="11.5" text-anchor="middle" fill="#9198a1">30m — the only value</text>
  <text x="622" y="286" font-size="11.5" text-anchor="middle" font-weight="600" fill="#ffa657">unbounded, default 1h</text>

  <!-- row 4 -->
  <text x="138" y="354" font-size="11.5" text-anchor="middle" fill="#9198a1">write 1.25× / 2.0×</text>
  <text x="138" y="370" font-size="11.5" text-anchor="middle" fill="#9198a1">read 0.1×</text>
  <text x="380" y="354" font-size="11.5" text-anchor="middle" fill="#9198a1">write 1.25×</text>
  <text x="380" y="370" font-size="11.5" text-anchor="middle" fill="#9198a1">read 0.1×</text>
  <text x="622" y="354" font-size="11.5" text-anchor="middle" fill="#9198a1">read 0.1× &#8230; and</text>
  <text x="622" y="370" font-size="11.5" text-anchor="middle" font-weight="700" fill="#ff7b72">storage, per hour</text>

  <line x1="24" y1="176" x2="736" y2="176" stroke="#30363d"/>
  <line x1="24" y1="244" x2="736" y2="244" stroke="#30363d"/>
  <line x1="24" y1="300" x2="736" y2="300" stroke="#30363d"/>
  <line x1="498" y1="60" x2="498" y2="380" stroke="#30363d" stroke-dasharray="3 3"/>

  <text x="24" y="392" font-size="11.5" fill="#9198a1">Only Gemini makes <tspan font-weight="600" fill="#e6edf3">time a cost axis</tspan> — an idle session accrues charges instead of merely losing its cache.</text>
</svg>
